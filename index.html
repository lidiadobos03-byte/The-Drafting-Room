<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Drafting Room — Jewelry Sketch Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#F5F3EE;
    --mat:#FFFFFF;
    --ink:#262420;
    --ink-soft:#6b665d;
    --brass:#A9865B;
    --brass-deep:#8C6E45;
    --stone:#DCD8CE;
    --stone-dark:#C7C2B6;
    --shadow: rgba(38,36,32,0.14);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--wall);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Hero ---------- */
  .hero{
    max-width:1180px;
    margin:0 auto;
    padding:96px 40px 64px;
    border-bottom:1px solid var(--stone-dark);
  }
  .hero-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--brass-deep);
    margin:0 0 22px;
  }
  .hero h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(40px, 6vw, 76px);
    line-height:1.02;
    margin:0 0 28px;
    letter-spacing:-0.01em;
    max-width:14ch;
  }
  .hero-meta{
    display:flex;
    flex-wrap:wrap;
    gap:40px;
    margin-top:36px;
    padding-top:28px;
    border-top:1px solid var(--stone);
  }
  .hero-meta div{font-size:14px;color:var(--ink-soft);}
  .hero-meta strong{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--ink);
    letter-spacing:0.04em;
    margin-bottom:4px;
  }

  /* ---------- Section ---------- */
  .section{
    max-width:1180px;
    margin:0 auto;
    padding:0 40px;
  }
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:24px;
    padding:56px 0 30px;
    border-bottom:1px solid var(--stone-dark);
    margin-bottom:44px;
  }
  .section-head h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(26px,3.4vw,38px);
    margin:0;
    letter-spacing:-0.01em;
  }
  .section-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:48px 36px;
    padding-bottom:64px;
  }

  /* ---------- Frame (signature element) ---------- */
  .frame-wrap{
    position:relative;
    padding:22px;
  }
  .frame-wrap::before,
  .frame-wrap::after,
  .frame-wrap .tick-tr,
  .frame-wrap .tick-bl{
    content:"";
    position:absolute;
    width:14px;
    height:14px;
    border:1px solid var(--brass);
    opacity:0.9;
  }
  .frame-wrap::before{ top:0; left:0; border-right:none; border-bottom:none; }
  .frame-wrap::after{ bottom:0; right:0; border-left:none; border-top:none; }
  .tick-tr{ top:0; right:0; border-left:none; border-bottom:none; }
  .tick-bl{ bottom:0; left:0; border-right:none; border-top:none; }

  .mat{
    background:var(--mat);
    padding:16px;
    box-shadow: 0 18px 40px -22px var(--shadow), 0 2px 6px rgba(38,36,32,0.06);
    transition: transform .35s ease, box-shadow .35s ease;
    cursor: zoom-in;
  }
  .frame-wrap:hover .mat{
    transform:translateY(-4px);
    box-shadow: 0 26px 52px -20px var(--shadow), 0 4px 10px rgba(38,36,32,0.08);
  }
  .img-frame{
    position:relative;
    overflow:hidden;
    border:1px solid var(--stone);
  }
  .img-frame img{
    display:block;
    width:100%;
    height:auto;
    transition: transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .frame-wrap:hover .img-frame img{
    transform: scale(1.09);
  }
  .zoom-cue{
    position:absolute;
    right:10px;
    bottom:10px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(246,244,238,0.92);
    border:1px solid var(--stone-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:translateY(6px);
    transition: opacity .3s ease, transform .3s ease;
  }
  .frame-wrap:hover .zoom-cue{
    opacity:1;
    transform:translateY(0);
  }
  .zoom-cue svg{ width:14px; height:14px; stroke:var(--ink); }

  .label{
    padding:18px 4px 4px;
  }
  .label-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .label-title{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:18px;
    letter-spacing:-0.005em;
  }
  .label-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--brass-deep);
    letter-spacing:0.06em;
    white-space:nowrap;
  }
  .label-material{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .label-specs{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  /* ---------- Footer ---------- */
  footer{
    max-width:1180px;
    margin:0 auto;
    padding:40px 40px 90px;
    border-top:1px solid var(--stone-dark);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
  }
  footer .mono{
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  @media (max-width:560px){
    .hero{padding:64px 22px 44px;}
    .section{padding:0 22px;}
    .grid{grid-template-columns:1fr; gap:40px;}
    footer{padding:32px 22px 64px;}
  }

  @media (prefers-reduced-motion: reduce){
    .mat{transition:none;}
    .img-frame img{transition:none;}
  }

  /* ---------- Lightbox ---------- */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(20,19,17,0.94);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 64px 24px;
    opacity:0;
    visibility:hidden;
    transition: opacity .35s ease;
    z-index:100;
  }
  .lightbox.open{
    opacity:1;
    visibility:visible;
  }
  .lightbox-inner{
    max-width:1000px;
    width:100%;
    display:grid;
    grid-template-columns: minmax(0,1fr);
    gap:22px;
    transform: translateY(14px);
    transition: transform .4s ease;
  }
  .lightbox.open .lightbox-inner{ transform:translateY(0); }
  .lightbox-stage{
    background:var(--mat);
    padding:20px;
    max-height:74vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lightbox-stage img{
    max-width:100%;
    max-height:66vh;
    width:auto;
    height:auto;
    display:block;
  }
  .lightbox-caption{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    color:var(--wall);
  }
  .lightbox-caption .lc-title{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:24px;
  }
  .lightbox-caption .lc-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--brass);
    letter-spacing:0.06em;
    margin-top:4px;
  }
  .lightbox-caption .lc-material{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:#c9c5ba;
    margin-top:6px;
  }
  .lightbox-caption .lc-specs{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:#c9c5ba;
    margin-top:4px;
  }
  .lightbox-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:#c9c5ba;
    white-space:nowrap;
    padding-top:4px;
  }
  .lb-btn{
    position:absolute;
    background:transparent;
    border:1px solid rgba(246,244,238,0.35);
    color:var(--wall);
    width:44px;
    height:44px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: border-color .2s ease, background .2s ease;
  }
  .lb-btn:hover{ border-color:var(--brass); background:rgba(169,134,91,0.18); }
  .lb-btn svg{ width:18px; height:18px; stroke:var(--wall); }
  .lb-close{ top:20px; right:24px; }
  .lb-prev{ left:16px; top:50%; transform:translateY(-50%); }
  .lb-next{ right:16px; top:50%; transform:translateY(-50%); }
  @media (max-width:720px){
    .lb-prev, .lb-next{ display:none; }
    .lightbox{ padding:56px 16px; }
    .lightbox-caption .lc-title{ font-size:19px; }
  }
</style>
</head>
<body>

  <div class="hero">
    <p class="hero-eyebrow">Studio Portfolio · Sketchbook Vol. I</p>
    <h1>The Drafting Room</h1>
    <div class="hero-meta">

  <main id="gallery"></main>

  <footer>

      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="lightbox-inner">
      <div class="lightbox-stage"><img id="lbImg" src="" alt=""></div>
      <div class="lightbox-caption">
        <div>
          <div class="lc-title" id="lbTitle"></div>
          <div class="lc-code" id="lbCode"></div>
          <div class="lc-material" id="lbMaterial"></div>
          <div class="lc-specs" id="lbSpecs"></div>
        </div>
        <div class="lightbox-count" id="lbCount"></div>
      </div>
    </div>
  </div>

            <img src="data:image/jpeg;base64,${p.b64}" alt="${p.title} sketch" loading="lazy">
            <span class="zoom-cue">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/><path d="M11 8v6M8 11h6"/></svg>
            </span>
          </div>
        </div>
        <div class="label">
          <div class="label-top">
            <span class="label-title">${p.title}</span>
            ${p.code ? `<span class="label-code">${p.code}</span>` : ""}
          </div>
          <div class="label-material">${p.material}</div>
          <div class="label-specs">${p.specs}</div>
        </div>
      `;
      grid.appendChild(wrap);
    });

    section.appendChild(grid);
    gallery.appendChild(section);
  });

  document.getElementById("meta-count").textContent = total + " sketches";

  // ---------- Lightbox logic ----------
  const lightbox = document.getElementById("lightbox");
  const lbImg = document.getElementById("lbImg");
  const lbTitle = document.getElementById("lbTitle");
  const lbCode = document.getElementById("lbCode");
  const lbMaterial = document.getElementById("lbMaterial");
  const lbSpecs = document.getElementById("lbSpecs");
  const lbCount = document.getElementById("lbCount");
  let current = 0;

  function openLightbox(index){
    current = index;
    renderLightbox();
    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeLightbox(){
    lightbox.classList.remove("open");
    document.body.style.overflow = "";
  }
  function renderLightbox(){
    const p = flat[current];
    lbImg.src = "data:image/jpeg;base64," + p.b64;
    lbImg.alt = p.title + " sketch, full view";
    lbTitle.textContent = p.title;
    lbCode.textContent = p.code || p.category;
    lbMaterial.textContent = p.material;
    lbSpecs.textContent = p.specs;
    lbCount.textContent = String(current + 1).padStart(2,"0") + " / " + String(flat.length).padStart(2,"0");
  }
  function step(delta){
    current = (current + delta + flat.length) % flat.length;
    renderLightbox();
  }

  gallery.addEventListener("click", e => {
    const mat = e.target.closest(".mat[data-index]");
    if(mat) openLightbox(Number(mat.dataset.index));
  });
  gallery.addEventListener("keydown", e => {
    if((e.key === "Enter" || e.key === " ") && e.target.classList.contains("mat")){
      e.preventDefault();
      openLightbox(Number(e.target.dataset.index));
    }
  });

  document.getElementById("lbClose").addEventListener("click", closeLightbox);
  document.getElementById("lbPrev").addEventListener("click", () => step(-1));
  document.getElementById("lbNext").addEventListener("click", () => step(1));
  lightbox.addEventListener("click", e => { if(e.target === lightbox) closeLightbox(); });

  document.addEventListener("keydown", e => {
    if(!lightbox.classList.contains("open")) return;
    if(e.key === "Escape") closeLightbox();
    if(e.key === "ArrowLeft") step(-1);
    if(e.key === "ArrowRight") step(1);
  });
</script>

</body>
</html>
